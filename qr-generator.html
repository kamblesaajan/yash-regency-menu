<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YASH REGENCY QR Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
body{font-family:Arial;text-align:center;padding:16px}
input,button{padding:12px;margin:8px;font-size:16px}
.card{border:1px solid #ccc;padding:15px;margin:15px auto;max-width:320px}
.qr{display:flex;justify-content:center;margin:15px}
@media print{.controls{display:none}.card{break-inside:avoid}}
</style>
</head>
<body>
<h2>YASH REGENCY</h2>
<h3>टेबल QR कोड तयार करा</h3>
<div class="controls">
<p>मेनू लिंक</p>
<input id="url" style="width:90%"
value="https://kamblesaajan.github.io/yash-regency-menu/">
<p>एकूण टेबल</p>
<input id="count" type="number" value="10" min="1" max="100">
<br>
<button onclick="generate()">QR तयार करा</button>
<button onclick="window.print()">Print / PDF</button>
</div>
<div id="output"></div>
<script>
function generate(){
 const base=document.getElementById("url").value.trim();
 const count=Number(document.getElementById("count").value);
 const out=document.getElementById("output");
 if(!base.startsWith("https://")||!Number.isInteger(count)||count<1||count>100){
  alert("योग्य लिंक आणि 1 ते 100 टेबल संख्या टाका.");return;
 }
 if(typeof QRCode==="undefined"){
  alert("QR लायब्ररी लोड झाली नाही. इंटरनेट तपासा.");return;
 }
 out.replaceChildren();
 for(let i=1;i<=count;i++){
  const url=new URL(base);
  url.searchParams.set("table",String(i));
  const card=document.createElement("div");
  card.className="card";
  const title=document.createElement("h3");
  title.textContent="YASH REGENCY - TABLE "+i;
  const qr=document.createElement("div");
  qr.className="qr";
  const link=document.createElement("p");
  link.textContent=url.toString();
  card.append(title,qr,link);
  out.append(card);
  new QRCode(qr,{text:url.toString(),width:200,height:200});
 }
}
</script>
</body>
</html>
