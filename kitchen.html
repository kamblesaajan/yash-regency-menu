
<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YASH REGENCY Kitchen</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background: #f3f4f6;
    }
    h1 { text-align: center; }
    input, button, select {
      padding: 12px;
      margin: 5px 0;
      width: 100%;
      box-sizing: border-box;
      font-size: 16px;
    }
    .order {
      background: white;
      padding: 14px;
      margin: 12px 0;
      border-radius: 10px;
      box-shadow: 0 1px 5px #ccc;
    }
    .muted { color: #555; }
    #orders { margin-top: 16px; }
  </style>
</head>
<body>
  <h1>YASH REGENCY</h1>
  <h2>🍳 Kitchen Dashboard</h2>

  <div id="login">
    <input id="email" type="email"
      placeholder="Kitchen User Email">
    <input id="password" type="password"
      placeholder="Password">
    <button id="loginBtn">Login</button>
  </div>

  <p id="message" class="muted"></p>
  <button id="logoutBtn" hidden>Logout</button>
  <div id="orders"></div>

  <script type="module">
    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getFirestore, collection, onSnapshot,
      doc, updateDoc, query, orderBy
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    import {
      getAuth, signInWithEmailAndPassword,
      signOut, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD1nikczF300yAMc9rOYukSvn08TQOWJNg",
      authDomain: "yash-qr-menu.firebaseapp.com",
      projectId: "yash-qr-menu",
      storageBucket: "yash-qr-menu.firebasestorage.app",
      messagingSenderId: "704490884119",
      appId: "1:704490884119:web:0844f7d412aee2369ee052"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const kitchenUID = "ogYY39TCfVRdSGkFalyEt9TnXGF3";
    const message = document.getElementById("message");
    const ordersDiv = document.getElementById("orders");

    let stopListening = null;

    document.getElementById("loginBtn").onclick = async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        message.textContent = "Login सुरू आहे...";
        await signInWithEmailAndPassword(auth, email, password);
      } catch (e) {
        message.textContent = "Login त्रुटी: " + e.message;
      }
    };

    document.getElementById("logoutBtn").onclick = async () => {
      if (stopListening) stopListening();
      await signOut(auth);
      ordersDiv.replaceChildren();
      message.textContent = "Logout झाले.";
    };

    onAuthStateChanged(auth, user => {
      if (stopListening) {
        stopListening();
        stopListening = null;
      }

      ordersDiv.replaceChildren();

      if (!user) {
        document.getElementById("login").hidden = false;
        document.getElementById("logoutBtn").hidden = true;
        return;
      }

      if (user.uid !== kitchenUID) {
        message.textContent = "या खात्याला Kitchen Dashboard ची परवानगी नाही.";
        signOut(auth);
        return;
      }

      document.getElementById("login").hidden = true;
      document.getElementById("logoutBtn").hidden = false;
      message.textContent = "Kitchen Login यशस्वी. ऑर्डर लोड होत आहेत...";

      const q = query(
        collection(db, "orders"),
        orderBy("createdAt", "desc")
      );

      stopListening = onSnapshot(q, snapshot => {
        ordersDiv.replaceChildren();

        if (snapshot.empty) {
          message.textContent = "अजून ऑर्डर उपलब्ध नाही.";
          return;
        }

        message.textContent = "एकूण ऑर्डर: " + snapshot.size;

        snapshot.forEach(orderDoc => {
          const o = orderDoc.data();
          const card = document.createElement("div");
          card.className = "order";

          const title = document.createElement("h3");
          title.textContent = "टेबल: " + (o.tableNo || "-");
          card.appendChild(title);

          const itemsTitle = document.createElement("p");
          itemsTitle.textContent = "पदार्थ:";
          card.appendChild(itemsTitle);

          (Array.isArray(o.items) ? o.items : []).forEach(item => {
            const p = document.createElement("p");
            p.textContent =
              (item.name || "पदार्थ") + " × " +
              (item.qty || 1) + " — ₹" +
              (Number(item.price) || 0);
            card.appendChild(p);
          });

          const total = document.createElement("strong");
          total.textContent = "एकूण: ₹" + (Number(o.total) || 0);
          card.appendChild(total);

          const status = document.createElement("p");
          status.textContent = "स्थिती: " + (o.status || "नवीन");
          card.appendChild(status);

          const select = document.createElement("select");
          ["नवीन", "तयार होत आहे", "तयार", "पूर्ण"].forEach(s => {
            const option = document.createElement("option");
            option.value = s;
            option.textContent = s;
            option.selected = (o.status || "नवीन") === s;
            select.appendChild(option);
          });

          const save = document.createElement("button");
          save.textContent = "स्थिती अपडेट करा";
          save.onclick = async () => {
            save.disabled = true;
            try {
              await updateDoc(doc(db, "orders", orderDoc.id), {
                status: select.value
              });
            } catch (e) {
              message.textContent = "अपडेट त्रुटी: " + e.message;
            } finally {
              save.disabled = false;
            }
          };

          card.appendChild(select);
          card.appendChild(save);
          ordersDiv.appendChild(card);
        });
      }, error => {
        message.textContent = "ऑर्डर लोड त्रुटी: " + error.message;
      });
    });
  </script>
</body>
</html>
