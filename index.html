<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YASH REGENCY QR MENU</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;margin:0;background:#f4f5f4;color:#222}
header{background:#174b37;color:white;text-align:center;padding:18px}
main{padding:15px;max-width:680px;margin:auto}
.item,.panel{background:white;padding:14px;margin:10px 0;border-radius:10px;box-shadow:0 1px 4px #ddd}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px}
button,select{background:#174b37;color:white;border:0;border-radius:7px;padding:10px 14px;font-size:16px;cursor:pointer}
button:disabled{opacity:.55}
input{padding:12px;width:100%;margin:6px 0;border:1px solid #ccc;border-radius:7px;font-size:16px}
.small{font-size:13px;color:#555;overflow-wrap:anywhere}
.status{font-weight:bold;color:#174b37}
.language{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.language button{font-size:14px;padding:9px 12px}
.language button.active{background:#e4b84b;color:#222}
.price{font-weight:bold;margin-top:5px}
</style>
</head>
<body>

<header>
  <h1>YASH REGENCY</h1>
  <p id="welcome"></p>
  <div class="language">
    <button type="button" data-lang="mr">मराठी</button>
    <button type="button" data-lang="en">English</button>
    <button type="button" data-lang="hi">हिंदी</button>
  </div>
</header>

<main>
  <h2 id="menuTitle"></h2>
  <div id="menu"></div>

  <div class="panel">
    <h2 id="cartTitle"></h2>
    <div id="cartItems"></div>
    <h3><span id="totalLabel"></span> ₹<span id="total">0</span></h3>
    <input id="table" placeholder="">
    <button id="placeBtn" type="button"></button>
    <p id="result"></p>
  </div>

  <div class="panel">
    <h2 id="trackTitle"></h2>
    <p id="trackHelp" class="small"></p>
    <input id="trackId" placeholder="">
    <button id="trackBtn" type="button"></button>
    <p id="trackResult"></p>
  </div>
</main>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getFirestore,collection,addDoc,serverTimestamp,doc,getDoc,
 onSnapshot,query,orderBy,getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {getAuth,signInAnonymously}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig={
 apiKey:"AIzaSyD1nikczF300yAMc9rOYukSvn08TQOWJNg",
 authDomain:"yash-qr-menu.firebaseapp.com",
 projectId:"yash-qr-menu",
 storageBucket:"yash-qr-menu.firebasestorage.app",
 messagingSenderId:"704490884119",
 appId:"1:704490884119:web:0844f7d412aee2369ee052"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);

const params=new URLSearchParams(location.search);
let lang=params.get("lang")||"mr";
if(!["mr","en","hi"].includes(lang)) lang="mr";

let cart=[],menu=[],stopTracking=null,busy=false;

const el=id=>document.getElementById(id);
const node=(tag,text)=>{
 const n=document.createElement(tag);
 n.textContent=text;
 return n;
};

const words={
 mr:{
  welcome:"आमच्या QR मेनूमध्ये आपले स्वागत आहे",
  menu:"🍽️ आमचा मेनू",

  total:"एकूण:",
  table:"टेबल नंबर लिहा",
  room:"रूम नंबर",
  place:"ऑर्डर तयार करा",
  add:"जोडा +",
  remove:"काढा",

  help:"ऑर्डर दिल्यानंतर मिळालेला पूर्ण ऑर्डर क्रमांक येथे टाका.",
  orderId:"ऑर्डर क्रमांक",
  trackBtn:"स्थिती पाहा",

  needItem:"कृपया मेनूमधून पदार्थ निवडा.",
  needId:"कृपया ऑर्डर क्रमांक टाका.",
  success:"ऑर्डर यशस्वी! ऑर्डर क्रमांक:",
  notFound:"ऑर्डर सापडली नाही. योग्य ऑर्डर क्रमांक तपासा.",
  forbidden:"या ब्राउझरमध्ये या ऑर्डरची स्थिती पाहण्याची परवानगी नाही.",
  status:"स्थिती:",
  tableLabel:"टेबल / रूम:",
  totalLabel:"एकूण:",
  failed:"ऑर्डर पाठवता आली नाही: ",
  trackFailed:"स्थिती पाहता आली नाही: ",
  menuFailed:"टीप: Firebase मेनू वाचता आले नाही; नमुना मेनू दाखवत आहोत.",
  new:"नवीन",
  preparing:"तयार होत आहे",
  ready:"तयार",
  served:"सर्व्ह केले",
  cancelled:"रद्द"
 },
 en:{
  welcome:"Welcome to our QR menu",
  menu:"🍽️ Our Menu",
  loading:"Loading menu...",
  unavailable:"No items are currently available.",
  cart:"🛒 Your Order",
  empty:"No items selected yet.",
  total:"Total:",
  table:"Enter table number",
  room:"Enter room number",
  place:"Place Order",
  add:"Add +",
  remove:"Remove",
  track:"🔎 Track Order Status",
  help:"Enter the full order ID you received after placing your order.",
  orderId:"Order ID",
  trackBtn:"Check Status",
  needTable:"Please enter a table or room number.",
  needItem:"Please select items from the menu.",
  needId:"Please enter an order ID.",
  success:"Order placed successfully! Order ID:",
  notFound:"Order not found. Please check the order ID.",
  forbidden:"This browser is not authorized to view this order.",
  status:"Status:",
  tableLabel:"Table / Room:",
  totalLabel:"Total:",
  failed:"Could not place order: ",
  trackFailed:"Could not check status: ",
  menuFailed:"Note: Could not load Firebase menu; showing sample menu.",
  new:"New",
  preparing:"Preparing",
  ready:"Ready",
  served:"Served",
  cancelled:"Cancelled"
 },
 hi:{
  welcome:"हमारे QR मेनू में आपका स्वागत है",
  menu:"🍽️ हमारा मेनू",
  loading:"मेनू लोड हो रहा है...",
  unavailable:"फिलहाल कोई व्यंजन उपलब्ध नहीं है।",
  cart:"🛒 आपका ऑर्डर",
  empty:"अभी कोई व्यंजन नहीं चुना गया है।",
  total:"कुल:",
  table:"टेबल नंबर लिखें",
  room:"कमरे का नंबर लिखें",
  place:"ऑर्डर करें",
  add:"जोड़ें +",
  remove:"हटाएँ",
  track:"🔎 ऑर्डर की स्थिति देखें",
  help:"ऑर्डर देने के बाद मिला पूरा ऑर्डर नंबर यहाँ डालें।",
  orderId:"ऑर्डर नंबर",
  trackBtn:"स्थिति देखें",
  needTable:"कृपया टेबल या कमरे का नंबर लिखें।",
  needItem:"कृपया मेनू से व्यंजन चुनें।",
  needId:"कृपया ऑर्डर नंबर डालें।",
  success:"ऑर्डर सफलतापूर्वक हुआ! ऑर्डर नंबर:",
  notFound:"ऑर्डर नहीं मिला। कृपया ऑर्डर नंबर जाँचें।",
  forbidden:"इस ब्राउज़र को इस ऑर्डर की स्थिति देखने की अनुमति नहीं है।",
  status:"स्थिति:",
  tableLabel:"टेबल / कमरा:",
  totalLabel:"कुल:",
  failed:"ऑर्डर नहीं भेजा जा सका: ",
  trackFailed:"स्थिति नहीं देखी जा सकी: ",
  menuFailed:"ध्यान दें: Firebase मेनू नहीं खुला; नमूना मेनू दिखाया जा रहा है।",
  new:"नया",
  preparing:"तैयार हो रहा है",
  ready:"तैयार है",
  served:"परोस दिया गया",
  cancelled:"रद्द"
 }
};

// नमुना मेनूतील पदार्थांची भाषांतरे
const translations={
 "Tea":{mr:"चहा",hi:"चाय"},
 "Coffee":{mr:"कॉफी",hi:"कॉफी"},
 "Veg Soup":{mr:"व्हेज सूप",hi:"वेज सूप"},
 "French Fries":{mr:"फ्रेंच फ्राइज",hi:"फ्रेंच फ्राइज"},
 "Veg Manchurian":{mr:"व्हेज मंचुरियन",hi:"वेज मंचूरियन"},
 "Paneer Butter Masala":{mr:"पनीर बटर मसाला",hi:"पनीर बटर मसाला"},
 "Dal Fry":{mr:"डाळ फ्राय",hi:"दाल फ्राई"},
 "Chapati":{mr:"चपाती",hi:"चपाती"},
 "Jeera Rice":{mr:"जीरा राईस",hi:"जीरा राइस"},
 "Veg Biryani":{mr:"व्हेज बिर्याणी",hi:"वेज बिरयानी"},
 "Chicken Biryani":{mr:"चिकन बिर्याणी",hi:"चिकन बिरयानी"},
 "Ice Cream":{mr:"आईस्क्रीम",hi:"आइसक्रीम"}
};

const defaults=[
 ["Tea",20],["Coffee",30],["Veg Soup",100],
 ["French Fries",120],["Veg Manchurian",180],
 ["Paneer Butter Masala",240],["Dal Fry",150],
 ["Chapati",15],["Jeera Rice",130],
 ["Veg Biryani",180],["Chicken Biryani",240],
 ["Ice Cream",80]
];

function t(key){return words[lang][key]||words.en[key]||key;}

function translateItem(name){
 const item=translations[name];
 if(!item)return name;
 return lang==="en"?name:(item[lang]||name);
}

function translateStatus(status){
 const s=String(status||"new").toLowerCase();
 const map={
  "नवीन":"new","new":"new",
  "तयार होत आहे":"preparing","preparing":"preparing",
  "तयार":"ready","ready":"ready",
  "सर्व्ह केले":"served","served":"served",
  "रद्द":"cancelled","cancelled":"cancelled"
 };
 return t(map[s]||"new");
}

function setText(id,value){el(id).textContent=value;}

function applyLanguage(){
 document.documentElement.lang=lang;
 setText("welcome",t("welcome"));
 setText("menuTitle",t("menu"));
 setText("cartTitle",t("cart"));
 setText("totalLabel",t("total"));
 setText("placeBtn",t("place"));
 setText("trackTitle",t("track"));
 setText("trackHelp",t("help"));
 setText("trackBtn",t("trackBtn"));
 el("table").placeholder=params.has("room")?t("room"):t("table");
 el("trackId").placeholder=t("orderId");

 document.querySelectorAll("[data-lang]").forEach(b=>{
  b.classList.toggle("active",b.dataset.lang===lang);
 });

 showMenu();
 showCart();
}

function changeLanguage(newLang){
 lang=newLang;
 params.set("lang",lang);
 const newUrl=location.pathname+"?"+params.toString();
 history.replaceState({}, "", newUrl);
 applyLanguage();
 if(el("result").dataset.kind==="success"){
  setText("resultMessage",t("success"));
 }
}

document.querySelectorAll("[data-lang]").forEach(b=>{
 b.addEventListener("click",()=>changeLanguage(b.dataset.lang));
});

async function loadMenu(){
 setText("menu",t("loading"));
 try{
  const snap=await getDocs(query(collection(db,"menu"),orderBy("name")));
  menu=snap.empty
   ?defaults.map((a,i)=>({id:"default-"+i,name:a[0],price:a[1],available:true}))
   :snap.docs.map(d=>({id:d.id,...d.data()}));
 }catch(e){
  menu=defaults.map((a,i)=>({id:"default-"+i,name:a[0],price:a[1],available:true}));
  setText("result",t("menuFailed"));
 }
 showMenu();
}

function showMenu(){
 const root=el("menu");
 root.replaceChildren();
 const items=menu.filter(x=>x.available!==false);

 if(!items.length){
  root.textContent=t("unavailable");
  return;
 }

 items.forEach(x=>{
  const row=document.createElement("div");
  row.className="item";

  const info=document.createElement("div");
  info.append(
   node("b",translateItem(x.name)),
   document.createElement("br"),
   node("span","₹"+(Number(x.price)||0))
  );

  const b=node("button",t("add"));
  b.type="button";
  b.onclick=()=>{
   cart.push({id:x.id,name:x.name,price:Number(x.price)||0});
   showCart();
  };

  row.append(info,b);
  root.append(row);
 });
}

function showCart(){
 const root=el("cartItems");
 root.replaceChildren();

 if(!cart.length){
  root.textContent=t("empty");
 }else{
  cart.forEach((x,i)=>{
   const row=document.createElement("p");
   row.append(document.createTextNode(
    `${translateItem(x.name)} — ₹${x.price} `
   ));
   const b=node("button",t("remove"));
   b.type="button";
   b.style.padding="5px 8px";
   b.onclick=()=>{
    cart.splice(i,1);
    showCart();
   };
   row.append(b);
   root.append(row);
  });
 }

 setText("total",cart.reduce((s,x)=>s+x.price,0));
}

async function placeOrder(){
 if(busy)return;

 const table=el("table").value.trim();

 if(!table){alert(t("needTable"));return;}
 if(!cart.length){alert(t("needItem"));return;}

 busy=true;
 el("placeBtn").disabled=true;

 try{
  if(!auth.currentUser)await signInAnonymously(auth);

  const items=cart.map(x=>({
   name:x.name,
   price:x.price,
   qty:1
  }));

  const total=cart.reduce((s,x)=>s+x.price,0);

  const ref=await addDoc(collection(db,"orders"),{
   hotel:"YASH REGENCY",
   tableNo:table,
   customerName:"",
   notes:"",
   items,
   total,
   status:"नवीन",
   customerUid:auth.currentUser.uid,
   createdAt:serverTimestamp()
  });

  el("result").replaceChildren();
  el("result").dataset.kind="success";
  const message=node("span",t("success")+" ");
  message.id="resultMessage";
  el("result").append(message,node("p",ref.id));

  el("trackId").value=ref.id;
  cart=[];
  showCart();
  el("table").value="";
  await trackOrder();
 }catch(e){
  console.error(e);
  el("result").dataset.kind="error";
  setText("result",t("failed")+e.message);
 }finally{
  busy=false;
  el("placeBtn").disabled=false;
 }
}

async function trackOrder(){
 const id=el("trackId").value.trim();
 const out=el("trackResult");

 if(!id){out.textContent=t("needId");return;}

 try{
  if(!auth.currentUser)await signInAnonymously(auth);
  if(stopTracking){stopTracking();stopTracking=null;}

  const ref=doc(db,"orders",id);
  const snap=await getDoc(ref);

  if(!snap.exists()){
   out.textContent=t("notFound");
   return;
  }

  if(snap.data().customerUid!==auth.currentUser.uid){
   out.textContent=t("forbidden");
   return;
  }

  stopTracking=onSnapshot(ref,s=>{
   if(!s.exists()){
    out.textContent=t("notFound");
    return;
   }

   const o=s.data();
   out.replaceChildren();

   const status=node("span",t("status")+" "+translateStatus(o.status));
   status.className="status";
   out.append(
    status,
    node("p",t("tableLabel")+" "+(o.tableNo||"-")),
    node("p",t("totalLabel")+" ₹"+(Number(o.total)||0))
   );
  },e=>{
   out.textContent=t("trackFailed")+e.message;
  });
 }catch(e){
  out.textContent=t("trackFailed")+e.message;
 }
}

el("placeBtn").addEventListener("click",placeOrder);
el("trackBtn").addEventListener("click",trackOrder);

// QR मधील रूम/टेबल नंबर जतन करा
const roomNumber=params.get("room");
const tableNumber=params.get("table");
const selectedNumber=roomNumber||tableNumber;

if(selectedNumber){
 el("table").value=selectedNumber;
 el("table").readOnly=true;
}

applyLanguage();

try{
 await signInAnonymously(auth);
}catch(e){
 console.error("Firebase sign-in error:",e);
}

await loadMenu();
showCart();
</script>
</body>
</html>
