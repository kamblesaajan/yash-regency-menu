<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YASH REGENCY QR Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 16px; text-align: center; }
    input, button { padding: 12px; margin: 6px; font-size: 16px; }
    .card { border: 1px solid #ccc; padding: 16px; margin: 16px auto; max-width: 360px; }
    .qr { display: flex; justify-content: center; margin: 12px; }
    @media print {
      button, input, .controls { display: none; }
      .card { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <h2>YASH REGENCY</h2>
  <h3>Table QR Code Generator</h3>

  <div class="controls">
    <label>तुमच्या प्रकाशित मेनूची लिंक:</label><br>
    <input id="menuUrl" type="url"
      placeholder="https://username.github.io/repository/"
      style="width:90%">
    <br>
    <label>किती टेबल?</label><br>
    <input id="count" type="number" value="10" min="1" max="100">
    <br>
    <button onclick="generate()">QR कोड तयार करा</button>
    <button onclick="window.print()">Print / Save PDF</button>
  </div>

  <div id="output"></div>

  <script>
    function generate() {
      const base = document.getElementById("menuUrl").value.trim();
      const count = Number(document.getElementById("count").value);
      const output = document.getElementById("output");

      if (!base.startsWith("https://")) {
        alert("तुमच्या प्रकाशित मेनूची https लिंक भरा.");
        return;
      }

      if (!Number.isInteger(count) || count < 1 || count > 100) {
        alert("1 ते 100 मधील टेबल संख्या टाका.");
        return;
      }

      output.innerHTML = "";

      for (let i = 1; i <= count; i++) {
        const url = new URL(base);
        url.searchParams.set("table", String(i));

        const card = document.createElement("div");
        card.className = "card";

        const title = document.createElement("h3");
        title.textContent = "YASH REGENCY - TABLE " + i;
        card.appendChild(title);

        const qr = document.createElement("div");
        qr.className = "qr";
        card.appendChild(qr);

        const link = document.createElement("p");
        link.textContent = url.toString();
        link.style.overflowWrap = "anywhere";
        card.appendChild(link);

        output.appendChild(card);

        if (typeof QRCode === "undefined") {
          alert("QR लायब्ररी लोड झाली नाही. इंटरनेट तपासा.");
          return;
        }

        new QRCode(qr, {
          text: url.toString(),
          width: 200,
          height: 200
        });
      }
    }
  </script>
</body>
</html>
